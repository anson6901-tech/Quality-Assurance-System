services:
    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-qa_insight}
            MYSQL_USER: ${DB_USERNAME:-qa_insight}
            MYSQL_PASSWORD: ${DB_PASSWORD:-qa_insight}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
        ports:
            - '127.0.0.1:3306:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s
    app:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        depends_on:
            db:
                condition: service_healthy
        environment:
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-qa_insight}
            DB_USERNAME: ${DB_USERNAME:-qa_insight}
            DB_PASSWORD: ${DB_PASSWORD:-qa_insight}
        volumes:
            - .:/var/www/html
            - composer_dependencies:/var/www/html/vendor
            - node_dependencies:/var/www/html/node_modules
        ports:
            - '127.0.0.1:8000:8000'
            - '127.0.0.1:5173:5173'
        command:
            - npx
            - concurrently
            - -c
            - '#93c5fd,#c4b5fd,#fdba74'
            - php artisan serve --host=0.0.0.0 --no-reload
            - php artisan queue:listen --tries=1
            - npm run dev -- --host 0.0.0.0
            - --names=server,queue,vite

volumes:
    composer_dependencies:
    node_dependencies:
    mysql_data:
